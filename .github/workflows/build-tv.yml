name: Build TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Generate signing keystore
        working-directory: app/android
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ghosten \
            -storepass ghosten123 -keypass ghosten123 \
            -dname "CN=GhostenFixed, OU=Dev, O=Dev, L=CN, ST=CN, C=CN"
          cat > key.properties <<'EOF'
          storePassword=ghosten123
          keyPassword=ghosten123
          keyAlias=ghosten
          storeFile=release.jks
          EOF

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build TV APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --flavor tv -t lib/main_tv.dart

      - name: List outputs
        working-directory: app
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghosten-tv-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
